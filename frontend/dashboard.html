  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">AI-Obs Kernel</p>
          <h1>Run Explorer</h1>
        </div>
        <dl class="summary-strip" aria-label="Run summary">
          <div>
            <dt>Total</dt>
            <dd id="summary-total">0</dd>
          </div>
          <div>
            <dt>Completed</dt>
            <dd id="summary-completed">0</dd>
          </div>
          <div>
            <dt>Mismatches</dt>
            <dd id="summary-mismatches">0</dd>
          </div>
          <div>
            <dt>Error signals</dt>
            <dd id="summary-errors">0</dd>
          </div>
        </dl>
      </header>

      <section class="toolbar" aria-label="Run explorer filters">
        <div class="filter-group" aria-label="Run state filter">
          <button type="button" data-state-filter="ALL">All</button>
          <button type="button" data-state-filter="SUCCESS">Success</button>
          <button type="button" data-state-filter="FAILED">Failed</button>
          <button type="button" data-state-filter="RUNNING">Running</button>
        </div>
        <div class="filter-group" aria-label="Evaluation filter">
          <button type="button" data-result-filter="ALL">All results</button>
          <button type="button" data-result-filter="MATCH">Match</button>
          <button type="button" data-result-filter="MISMATCH">Mismatch</button>
        </div>
      </section>

      <section class="dashboard-grid">
        <aside class="run-list-panel" aria-label="Run Explorer">
          <h2>Run Explorer</h2>
          <div id="run-list" class="run-list"></div>
        </aside>

        <section class="run-detail-panel" aria-labelledby="detail-title">
          <div class="detail-heading">
            <div>
              <p class="eyebrow">Run Summary</p>
              <h2 id="detail-title">No run selected</h2>
            </div>
            <span id="detail-status" class="status-badge">Idle</span>
          </div>

          <dl class="metric-grid" aria-label="Selected run summary">
            <div>
              <dt>Status</dt>
              <dd id="metric-status">--</dd>
            </div>
            <div>
              <dt>Duration</dt>
              <dd id="metric-duration">--</dd>
            </div>
            <div>
              <dt>Steps</dt>
              <dd id="metric-steps">--</dd>
            </div>
            <div>
              <dt>Observations</dt>
              <dd id="metric-observations">--</dd>
            </div>
            <div>
              <dt>Error Signal</dt>
              <dd id="metric-error">--</dd>
            </div>
            <div>
              <dt>Estimated Cost</dt>
              <dd id="metric-cost">--</dd>
            </div>
          </dl>

          <section class="error-section" aria-labelledby="error-title">
            <div class="section-heading">
              <h3 id="error-title">Errors</h3>
              <span id="error-severity" class="status-badge">None</span>
            </div>
            <div id="error-summary" class="error-summary"></div>
          </section>

          <section class="timeline-section" aria-labelledby="timeline-title">
            <h3 id="timeline-title">Timeline</h3>
            <ol id="timeline" class="timeline"></ol>
          </section>

          <section class="evaluation-section" aria-labelledby="evaluation-title">
            <div class="section-heading">
              <h3 id="evaluation-title">Evaluation</h3>
              <span id="evaluation-result" class="status-badge">Pending</span>
            </div>
            <div id="evaluation-delta" class="delta-grid"></div>
          </section>
        </section>
      </section>
    </main>
  </body>
