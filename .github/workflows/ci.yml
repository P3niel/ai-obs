name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 backend

      - name: Typecheck
        run: mypy backend/app backend/run_demo.py

      - name: Test
        working-directory: backend
        run: pytest

      - name: Security scan
        run: bandit -r backend
